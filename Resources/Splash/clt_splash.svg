<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#162236"/>
      <stop offset="100%" stop-color="#0F1923"/>
    </linearGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="62%">
      <stop offset="0%"   stop-color="#FFE95A"/>
      <stop offset="40%"  stop-color="#FFD700"/>
      <stop offset="78%"  stop-color="#C8A000"/>
      <stop offset="100%" stop-color="#8B6000"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFD700" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shine" cx="35%" cy="28%" r="45%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ballshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#FFD700" flood-opacity="0.5"/>
    </filter>
    <filter id="starglow" x="-80%" y="-80%" width="360%" height="360%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#FFD700" flood-opacity="0.95"/>
    </filter>
    <filter id="orbitglow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FFD700" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="80" ry="80" fill="url(#bg)"/>
  <circle cx="256" cy="245" r="185" fill="url(#glow)"/>
  <ellipse cx="256" cy="245" rx="178" ry="62"
           fill="none" stroke="#FFD700" stroke-width="3.5" stroke-opacity="0.6"
           stroke-dasharray="20 11" transform="rotate(-22 256 245)"
           filter="url(#orbitglow)"/>
  <circle cx="256" cy="245" r="150" fill="url(#ball)" filter="url(#ballshadow)"/>
  <circle cx="256" cy="245" r="150" fill="url(#shine)"/>
  <path d="M 108,252 Q 256,284 404,252" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.17"/>
  <path d="M 112,234 Q 256,205 400,234" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.17"/>
  <text x="256" y="270"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="148" font-weight="700"
        text-anchor="middle" dominant-baseline="middle"
        fill="#ffffff" opacity="0.96">7</text>
  <text x="256" y="358"
        font-family="Arial, Helvetica, sans-serif"
        font-size="44" font-weight="700"
        text-anchor="middle" dominant-baseline="middle"
        fill="#ffffff" opacity="0.90" letter-spacing="6">LOTTERY</text>
  <!-- Stars moved close around the ball so they show on splash -->
  <!-- Top-left star -->
  <g filter="url(#starglow)">
    <polygon points="128,112 135,133 157,133 140,146 147,168 128,155 109,168 116,146 99,133 121,133" fill="#FFD700"/>
  </g>
  <!-- Top-right star -->
  <g filter="url(#starglow)">
    <polygon points="384,112 389,129 407,129 393,139 398,156 384,147 370,156 375,139 361,129 379,129" fill="#FFD700"/>
  </g>
  <!-- Bottom-right star -->
  <g filter="url(#starglow)">
    <polygon points="384,355 388,368 402,368 392,376 396,389 384,382 372,389 376,376 366,368 380,368" fill="#FFD700"/>
  </g>
  <!-- Bottom-left star -->
  <g filter="url(#starglow)">
    <polygon points="128,355 133,372 151,372 137,382 142,399 128,390 114,399 119,382 105,372 123,372" fill="#FFD700"/>
  </g>
  <!-- Accent dots -->
  <circle cx="186" cy="136" r="5"   fill="#FFD700" opacity="0.55"/>
  <circle cx="326" cy="374" r="5"   fill="#FFD700" opacity="0.55"/>
  <circle cx="358" cy="158" r="3.5" fill="#FFD700" opacity="0.42"/>
  <circle cx="154" cy="352" r="3.5" fill="#FFD700" opacity="0.42"/>
</svg>
